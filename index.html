<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PostStudio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@300;400;500;600;700&family=Lora:wght@400;500;600;700&family=Playfair+Display:wght@400;700;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- ── Header ────────────────────────────────────── -->
<header id="header">
  <div id="logo">Post<span>Studio</span></div>
  <div class="header-actions">
    <button class="btn btn-ghost" id="btn-new">Novo</button>
    <button class="btn btn-ghost" id="btn-export-all">⬇ Todos</button>
    <button class="btn btn-primary" id="btn-export">⬇ Baixar PNG</button>
  </div>
</header>

<!-- ── Workspace ─────────────────────────────────── -->
<div id="workspace">

  <!-- ── Left panel ────────────────────────────── -->
  <aside class="panel" id="panel-left">
    <div class="panel-tabs">
      <div class="panel-tab active" data-panel="templates">Templates</div>
      <div class="panel-tab" data-panel="fundos">Fundos</div>
      <div class="panel-tab" data-panel="texto">Texto</div>
      <div class="panel-tab" data-panel="upload">Upload</div>
    </div>
    <div class="panel-body" id="panel-left-body"></div>
  </aside>

  <!-- ── Canvas area ───────────────────────────── -->
  <main id="canvas-area">
    <div id="canvas-wrapper">
      <div id="canvas">
        <div id="canvas-bg-layer"></div>
      </div>
    </div>
    <div id="zoom-indicator">100%</div>
    <div id="slides-bar"></div>
  </main>

  <!-- ── Right panel (properties) ─────────────── -->
  <aside class="panel" id="panel-right">
    <div class="panel-tabs">
      <div class="panel-tab active">Propriedades</div>
    </div>
    <div class="panel-body">

      <!-- Empty state -->
      <div class="empty-state" id="props-empty">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <path d="M3 9h18M9 21V9"/>
        </svg>
        <p>Selecione um elemento<br>no canvas para editar<br>suas propriedades.</p>
      </div>

      <!-- Props panel (populated by JS) -->
      <div id="props-panel" class="hidden"></div>

    </div>
  </aside>

</div>

<!-- ── Export overlay ────────────────────────────── -->
<div id="export-overlay">
  <div class="export-spinner"></div>
  <span>Exportando...</span>
</div>

<!-- ── Toast ──────────────────────────────────────── -->
<div id="toast"></div>

<!-- ── Scripts ───────────────────────────────────── -->
<script src="lib/html2canvas.min.js"></script>
<script src="js/backgrounds.js"></script>
<script src="js/templates.js"></script>
<script src="js/canvas.js"></script>
<script src="js/typography.js"></script>
<script src="js/carousel.js"></script>
<script src="js/export.js"></script>
<script src="js/app.js"></script>

</body>
</html>
