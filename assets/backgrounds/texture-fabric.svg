<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <filter id="f" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.45 0.45" numOctaves="4" seed="30" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <pattern id="weave" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="2" height="2" fill="rgba(255,255,255,0.03)"/>
      <rect x="2" y="2" width="2" height="2" fill="rgba(255,255,255,0.03)"/>
    </pattern>
  </defs>
  <rect width="1080" height="1350" fill="#0d0d0d"/>
  <rect width="1080" height="1350" fill="url(#weave)"/>
  <rect width="1080" height="1350" filter="url(#f)" opacity="0.1"/>
</svg>
