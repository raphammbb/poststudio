<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>PostStudio</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d0d0d">

  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PostStudio">
  <link rel="apple-touch-icon" href="assets/icon-180.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@300;400;500;600;700&family=Lora:wght@400;500;600;700&family=Playfair+Display:wght@400;700;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- ── Header ────────────────────────────────────── -->
<header id="header">
  <div id="logo">Post<span>Studio</span></div>
  <div class="header-actions">
    <button class="btn btn-ghost" id="btn-new">Novo</button>
    <button class="btn btn-ghost" id="btn-export-all">⬇ Todos</button>
    <button class="btn btn-primary" id="btn-export">⬇ Baixar PNG</button>
  </div>
</header>

<!-- ── Workspace ─────────────────────────────────── -->
<div id="workspace">

  <!-- ── Left panel ────────────────────────────── -->
  <aside class="panel" id="panel-left">
    <div class="panel-tabs">
      <div class="panel-tab active" data-panel="templates">Templates</div>
      <div class="panel-tab" data-panel="fundos">Fundos</div>
      <div class="panel-tab" data-panel="texto">Texto</div>
      <div class="panel-tab" data-panel="upload">Upload</div>
    </div>
    <div class="panel-body" id="panel-left-body"></div>
  </aside>

  <!-- ── Canvas area ───────────────────────────── -->
  <main id="canvas-area">
    <div id="canvas-wrapper">
      <div id="canvas">
        <div id="canvas-bg-layer"></div>
      </div>
    </div>
    <div id="zoom-indicator">100%</div>
    <div id="slides-bar"></div>
  </main>

  <!-- ── Right panel (properties) ─────────────── -->
  <aside class="panel" id="panel-right">
    <div class="panel-tabs">
      <div class="panel-tab active">Propriedades</div>
    </div>
    <div class="panel-body">

      <!-- Empty state -->
      <div class="empty-state" id="props-empty">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <path d="M3 9h18M9 21V9"/>
        </svg>
        <p>Selecione um elemento<br>no canvas para editar<br>suas propriedades.</p>
      </div>

      <!-- Props panel (populated by JS) -->
      <div id="props-panel" class="hidden"></div>

    </div>
  </aside>

</div>

<!-- ── Mobile bottom nav (< 960px) ───────────────── -->
<nav id="mobile-nav">
  <button class="mnav-btn" data-sheet="left" data-panel="templates">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <rect x="3" y="3" width="7" height="7" rx="1.5"/>
      <rect x="14" y="3" width="7" height="7" rx="1.5"/>
      <rect x="3" y="14" width="7" height="7" rx="1.5"/>
      <rect x="14" y="14" width="7" height="7" rx="1.5"/>
    </svg>
    <span>Templates</span>
  </button>
  <button class="mnav-btn" data-sheet="left" data-panel="fundos">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <rect x="3" y="3" width="18" height="18" rx="2"/>
      <circle cx="8.5" cy="8.5" r="1.5" fill="currentColor" stroke="none"/>
      <polyline points="21 15 16 10 5 21"/>
    </svg>
    <span>Fundos</span>
  </button>
  <button class="mnav-btn" data-sheet="left" data-panel="texto">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M4 7V4h16v3M9 20h6M12 4v16"/>
    </svg>
    <span>Texto</span>
  </button>
  <button class="mnav-btn" data-sheet="left" data-panel="upload">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
      <polyline points="17 8 12 3 7 8"/>
      <line x1="12" y1="3" x2="12" y2="15"/>
    </svg>
    <span>Upload</span>
  </button>
  <button class="mnav-btn" data-sheet="right" id="mnav-props">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <line x1="4" y1="6" x2="20" y2="6"/>
      <line x1="4" y1="12" x2="20" y2="12"/>
      <line x1="4" y1="18" x2="20" y2="18"/>
      <circle cx="9" cy="6" r="2" fill="var(--bg-panel)" stroke="currentColor" stroke-width="1.8"/>
      <circle cx="15" cy="12" r="2" fill="var(--bg-panel)" stroke="currentColor" stroke-width="1.8"/>
      <circle cx="9" cy="18" r="2" fill="var(--bg-panel)" stroke="currentColor" stroke-width="1.8"/>
    </svg>
    <span>Props</span>
  </button>
</nav>
<div id="sheet-backdrop"></div>

<!-- ── Export overlay ────────────────────────────── -->
<div id="export-overlay">
  <div class="export-spinner"></div>
  <span>Exportando...</span>
</div>

<!-- ── Toast ──────────────────────────────────────── -->
<div id="toast"></div>

<!-- ── Scripts ───────────────────────────────────── -->
<script src="lib/html2canvas.min.js"></script>
<script src="js/backgrounds.js"></script>
<script src="js/templates.js"></script>
<script src="js/canvas.js"></script>
<script src="js/typography.js"></script>
<script src="js/carousel.js"></script>
<script src="js/export.js"></script>
<script src="js/app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
</script>

</body>
</html>
